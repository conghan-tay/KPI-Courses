name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --dev
      - run: uv run ruff check services/agent services/mcp-tools tests scripts
      - run: uv run ruff format --check services/agent services/mcp-tools tests scripts
      # Includes fixture assertion A2 — every quote in expected.json appears
      # verbatim in source.md — and the workflow tests on a time-skipping
      # Temporal server. The model evals are excluded: they need a real provider.
      - run: uv run pytest -m "not e2e and not eval" --cov --cov-fail-under=80

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: services/gateway/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # Includes the withholding rule (DESIGN.md §4.5) asserted on the serialized
      # bytes, and the ingest SSE frame ordering.
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # No Playwright here any more. The API lives in Go behind Postgres and
      # Temporal now, so booting Next alone would exercise a proxy pointing at
      # nothing. The browser smoke moved to the `e2e` job below.

  e2e:
    runs-on: ubuntu-latest
    needs: [python, go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
        working-directory: services/web
      - run: npx playwright install --with-deps chromium
        working-directory: services/web

      # web, gateway, postgres, temporal and a worker on MODEL_PROVIDER=fake,
      # which replays docs/productDocs/fixtures. Deterministic, and no model key.
      - run: docker compose -f compose.yaml -f compose.e2e.yaml up --build -d --wait

      # Journey 1 in a real browser. Runs first: it asserts the designed empty
      # state, and the API suite below leaves courses behind.
      - run: npm run test:e2e
        working-directory: services/web

      # The cross-language contract — Go structs, Pydantic models and zod schemas
      # agree only by convention, and this is what catches a rename.
      - run: RUN_E2E=1 uv run pytest -m e2e tests/e2e

      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: services/web/playwright-report
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    needs: [python, go, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build gateway worker mcp-tools web
