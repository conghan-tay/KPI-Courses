# Overrides for `make test-e2e`.
#
# compose.yaml already defaults the worker to the fixture model, but a developer with
# MODEL_PROVIDER=anthropic in their .env would otherwise spend real money and get
# non-deterministic output on every e2e run. Pinning it here makes the suite
# deterministic whatever is in the environment.

services:
  worker:
    environment:
      MODEL_PROVIDER: fake
      MODEL_NAME: fake
      LANGSMITH_TRACING: "false"
