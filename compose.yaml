name: reverse-interview

# Journey 1 of the chat-native tutoring POC (docs/productDocs/POC_UserJourney.md):
# a candidate turns documents into a published knowledge base.
#
#   web      Next.js screens, and a BFF that turns uploads into text
#   gateway  the Go API — knowledge bases, publishing, the ingest SSE stream, Postgres
#   worker   the LangGraph ingestion pipeline, as Temporal activities
#
# MODEL_PROVIDER=fake needs no API key and replays docs/productDocs/fixtures, so
# `docker compose up` gives a working demo out of the box.

services:
  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    environment:
      # Server-side only. A NEXT_PUBLIC_ variable would be baked into the client
      # bundle, and the gateway is not reachable from a browser.
      API_BASE_URL: http://gateway:8080
      GATEWAY_API_KEY: ${API_KEY:-local-api-key}
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_KEY: ${API_KEY:-local-api-key}
      GATEWAY_PORT: "8080"
      DATABASE_URL: postgres://kb:kb@postgres:5432/kb?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: kb-ingest
      INGEST_TIMEOUT_MINUTES: ${INGEST_TIMEOUT_MINUTES:-20}
      # Retained for Journey 3's tutor; nothing reads these vectors back yet.
      CHROMA_URL: http://chroma:8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-kb_sections_vectors}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      # Liveness, not readiness: the web service only needs the API to be up, and
      # gating it on Temporal would mean a Temporal blip stops the studio from
      # rendering a list Postgres could answer perfectly well.
      test: ["CMD", "/gateway", "-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # `fake` replays docs/productDocs/fixtures/expected.json. Set a real
      # provider and a key for genuine ingestion.
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      MODEL_NAME: ${MODEL_NAME:-claude-opus-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-reverse-interview}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: kb-ingest
      FIXTURE_DIR: /app/fixtures
      MAX_SECTIONS: ${MAX_SECTIONS:-16}
      MAX_CHIPS: ${MAX_CHIPS:-8}
      MAX_QUIZ_ITEMS: ${MAX_QUIZ_ITEMS:-12}
      MAX_SOURCE_CHARS: ${MAX_SOURCE_CHARS:-400000}
    depends_on:
      temporal:
        condition: service_healthy
    # No ports: the worker polls a Temporal task queue and serves no HTTP.
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  postgres:
    # The data model from POC_UserJourney.md §1. The gateway owns the schema and
    # applies migrations at boot, so there is no init script here.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    volumes:
      # Postgres 18 stores data in a major-version subdirectory and wants the mount one
      # level up. Mounting at /var/lib/postgresql/data — correct for 17 and earlier —
      # makes the image refuse to start rather than silently misplace the data.
      - postgres_data:/var/lib/postgresql
    ports:
      # Exposed so `make seed-kb` and psql work from the host.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    # The dev server keeps the local stack to one container and persists to SQLite, so
    # an ingestion in flight survives `docker compose restart`. Production uses a real
    # Temporal cluster or Temporal Cloud; see docs/deployment.md.
    image: temporalio/temporal:1.8.2
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --port
      - "7233"
      - --ui-port
      - "8233"
      - --namespace
      - default
      - --db-filename
      - /home/temporal/temporal.db
    # Mounted at the image's existing home directory, which is owned by the temporal
    # user, so the named volume inherits that ownership. A volume mounted at a path
    # that does not exist in the image is created root-owned, and SQLite then fails
    # with "unable to open database file".
    volumes:
      - temporal_data:/home/temporal
    ports:
      - "7233:7233"
      # Temporal Web UI. 8233 rather than its default 8080 to leave that to the gateway.
      # Worth opening during an ingestion: one activity per document and per section.
      - "8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mcp-tools:
    # Parked. Nothing in Journey 1 calls it, and the demo tools it serves belong
    # to the support-ticket reference app. It stays because Journey 2's hour-long
    # chat will need tools (fetch a section, run the gate, meter the cost) and
    # this is where they will live.
    build:
      context: .
      dockerfile: services/mcp-tools/Dockerfile
    environment:
      MCP_PORT: "8001"
    ports:
      - "8001:8001"
    restart: unless-stopped

  chroma:
    # Not read by anything in Journey 1. Kept because Journey 3's tutor is the
    # caller it exists for, and the gateway still writes to it via /v1/knowledge.
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  temporal_data:
  chroma_data:
  redis_data:
