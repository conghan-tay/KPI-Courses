apiVersion: v1
kind: Namespace
metadata:
  name: kpi-courses
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kpi-courses-config
  namespace: kpi-courses
data:
  ENVIRONMENT: production
  # POC_UserJourney.md §0: one model for ingestion, and bigger/slower is fine.
  # `fake` is rejected at boot when ENVIRONMENT=production.
  MODEL_PROVIDER: anthropic
  MODEL_NAME: claude-opus-5
  # A Temporal cluster or Temporal Cloud namespace is a prerequisite; it is not
  # deployed by this manifest. See docs/deployment.md.
  TEMPORAL_ADDRESS: replace-with-temporal-host:7233
  TEMPORAL_NAMESPACE: replace-with-namespace
  TEMPORAL_TASK_QUEUE: course-ingest
  TEMPORAL_TLS: "true"
  # Bounds a whole ingestion run. Owned by the gateway because workflow code
  # cannot read the environment. Size it from a measured p99, not this default:
  # a run that trips it becomes a draft somebody has to retry.
  INGEST_TIMEOUT_MINUTES: "20"
  MAX_LESSONS: "9"
  MAX_POSITIONS: "8"
  # The web app reaches the gateway over the cluster network. Deliberately not a
  # NEXT_PUBLIC_ variable: the gateway has no public ingress, and the header the
  # web app uses to say who is signed in is trusted.
  API_BASE_URL: http://gateway:8080
  REDIS_URL: redis://replace-with-managed-redis:6379/0
  # Parked for Journey 3's tutor. Nothing reads these vectors back yet.
  CHROMA_URL: https://replace-with-managed-chroma-host
  CHROMA_HOST: replace-with-managed-chroma-host
  CHROMA_PORT: "443"
  CHROMA_SSL: "true"
  CHROMA_COLLECTION: course_knowledge
  EMBEDDING_MODEL: text-embedding-3-small
  LANGSMITH_TRACING: "true"
  LANGSMITH_PROJECT: kpi-courses-production
---
# Replace this example with External Secrets, AWS Secrets Manager, or GCP Secret Manager.
apiVersion: v1
kind: Secret
metadata:
  name: kpi-courses-secrets
  namespace: kpi-courses
type: Opaque
stringData:
  # Shared by the gateway (as API_KEY) and the web app (as GATEWAY_API_KEY).
  API_KEY: replace-me
  GATEWAY_API_KEY: replace-me
  # Managed Postgres. The gateway applies its migrations at boot under an advisory
  # lock, so several replicas rolling at once is safe and no migration Job is needed.
  DATABASE_URL: postgres://user:password@replace-with-managed-postgres:5432/courses?sslmode=require
  ANTHROPIC_API_KEY: replace-me
  OPENAI_API_KEY: replace-me
  LANGSMITH_API_KEY: replace-me
  TEMPORAL_API_KEY: replace-me
---
# The worker exposes no port and needs no Service: it polls a Temporal task queue.
# Scale it on task-queue backlog, not on HTTP concurrency. It is safe to scale
# horizontally — the pipeline holds no cross-activity state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kpi-courses
spec:
  replicas: 2
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/kpi-courses-worker:latest
          envFrom:
            - configMapRef: {name: kpi-courses-config}
            - secretRef: {name: kpi-courses-secrets}
          # A port check would prove nothing for a process that serves no HTTP.
          # This asserts the task queue actually has a live poller.
          readinessProbe:
            exec: {command: [python, -m, app.healthcheck]}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: [python, -m, app.healthcheck]}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: kpi-courses
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      # An ingestion holds an SSE connection open for the length of the run, and a
      # gateway that goes away mid-stream leaves the browser without status lines.
      # The run itself is safe either way: the replacement pod re-attaches a
      # completion watcher to every in-flight course at boot.
      terminationGracePeriodSeconds: 60
      containers:
        - name: gateway
          image: ghcr.io/your-org/kpi-courses-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: kpi-courses-config}
            - secretRef: {name: kpi-courses-secrets}
          # Readiness checks Temporal; liveness deliberately does not, so a
          # Temporal blip cannot cause a restart loop.
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            # Migrations run before the listener starts.
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
# ClusterIP, not LoadBalancer. The gateway trusts the X-Specialist-Id header its
# caller sends, so the web app must be its only client until real authentication
# replaces that. See the README.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: kpi-courses
spec:
  type: ClusterIP
  selector: {app: gateway}
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kpi-courses
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/kpi-courses-web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: {name: kpi-courses-config}
            - secretRef: {name: kpi-courses-secrets}
          readinessProbe:
            httpGet: {path: /studio, port: 3000}
          livenessProbe:
            httpGet: {path: /studio, port: 3000}
            initialDelaySeconds: 15
          # PDF extraction happens here, in-process, on a Specialist's upload.
          # This is the memory-hungriest thing the app does.
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
# The only public entry point. Put TLS and a managed WAF in front of this.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kpi-courses
spec:
  type: LoadBalancer
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 3000
